[package]
name = "framework-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "framework_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embeds a W3C WebDriver server in the app so `npm run test:e2e` can drive
# the real interface. Never enabled by default: a plain `cargo build`,
# `tauri dev`, or release build compiles without the plugins, so shipping a
# remote-automation surface by accident is not possible. The e2e harness is
# the only thing that passes `--features e2e`. The second plugin is the
# service's command surface (window states, script eval); its permission is
# granted at runtime in `run()` rather than in capabilities/, so builds
# without the feature never reference a permission they do not compile.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[dependencies]
framework-core = { path = "../crates/framework-core" }
connectorx.workspace = true
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
ts-rs.workspace = true
uuid.workspace = true
rfd = "0.15"
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
tauri-plugin-wdio = { version = "1.3", optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
