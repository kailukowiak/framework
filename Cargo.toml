[workspace]
members = ["crates/framework-core", "crates/framework-mcp", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "MIT OR Apache-2.0"

# These are the structural smells that matter in a codebase whose core is a
# formula compiler and operation dispatcher. They are warnings rather than
# hard errors because the existing long dispatch functions are tracked debt;
# new work should leave the warning set no worse than it found it.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
type_complexity = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"

[workspace.dependencies]
calamine = { version = "0.36", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
connectorx = { version = "0.4.5", default-features = false, features = ["fptr", "src_postgres", "src_mysql", "src_sqlite", "src_mssql", "dst_arrow"] }
dirs = "6"
fuzzy-matcher = { version = "0.3", default-features = false }
polars = { version = "=0.55.2", default-features = false, features = ["abs", "approx_unique", "binary_encoding", "bitwise", "coalesce", "cov", "cross_join", "csv", "cum_agg", "cumulative_eval", "dtype-array", "dtype-categorical", "dtype-date", "dtype-datetime", "dtype-decimal", "dtype-struct", "dtype-u8", "dtype-u16", "extract_jsonpath", "find_many", "hist", "interpolate", "interpolate_by", "is_between", "is_first_distinct", "is_in", "is_last_distinct", "is_unique", "json", "lazy", "list_drop_nulls", "list_gather", "list_sample", "list_to_struct", "log", "mode", "moment", "month_end", "month_start", "offset_by", "parquet", "pct_change", "product", "propagate_nans", "random", "range", "rank", "regex", "repeat_by", "rolling_window", "round_series", "row_hash", "semi_anti_join", "serde-lazy", "sign", "streaming", "string_encoding", "string_pad", "string_reverse", "strings", "temporal", "timezones", "top_k", "trigonometry"] }
parquet = { version = "54", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12.0.1", features = ["format"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

# FrameWork's data engine pulls in large generated and generic dependencies,
# especially Polars. Full dependency debug information makes each archive and
# every statically linked test binary enormous without making FrameWork's own
# code easier to debug. Keep line-level information for workspace crates, but
# compile third-party dependencies without it.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0
