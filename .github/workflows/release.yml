name: Release

# Cutting a release: push a tag (`git tag v0.1.0 && git push origin v0.1.0`),
# or run this workflow by hand from the Actions tab against an existing tag.
# The tag should match the `version` in src-tauri/tauri.conf.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The bug this catches: moving the tag without moving the version. Every
  # asset name and, more importantly, latest.json take their number from
  # tauri.conf.json rather than from the tag, so a v0.1.2 tag on a 0.1.1
  # working tree publishes a release that announces itself as 0.1.1. Installed
  # copies then compare their own version against an identical one and
  # correctly conclude there is nothing to install. Nothing about that looks
  # broken from the outside -- the release page is fine, the assets are fine,
  # updates simply never arrive -- so it is worth twenty seconds here rather
  # than three platforms spending an hour building an unusable release.
  verify-version:
    name: Tag matches app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Compare tag against tauri.conf.json
        # Via the environment, not interpolated into the script: a tag name is
        # attacker-controlled to anyone who can push one.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json. Bump the version, commit, and move the tag onto that commit."
            exit 1
          fi
          echo "$TAG matches src-tauri/tauri.conf.json ($version)."

  bundle:
    name: ${{ matrix.label }}
    needs: verify-version
    # Every entry passes src-tauri/tauri.release.conf.json, which is the only
    # place createUpdaterArtifacts is turned on. It cannot live in
    # tauri.conf.json: the moment a pubkey is configured, producing an updater
    # artifact means signing it, and `tauri build` fails outright with "a
    # public key has been found, but no private key" on any machine without
    # the release key. That would break `npm run test:e2e` and every local
    # bundle for anyone but the release signer, to serve a file only CI has
    # any use for.
    strategy:
      # One platform failing should not deny the others their installers —
      # a partially populated draft release is still worth inspecting.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. A universal binary would cover Intel Macs
          # too, but it compiles the (large) Polars and connectorx trees once
          # per architecture, and Apple stopped selling Intel Macs in 2023.
          # To bring Intel back: use `--target universal-apple-darwin` here and
          # add x86_64-apple-darwin to the rustup step below.
          - platform: macos-latest
            label: macOS (Apple Silicon .dmg)
            args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

          - platform: windows-latest
            label: Windows (.exe + .msi)
            args: --config src-tauri/tauri.release.conf.json

          # Built on the oldest supported Ubuntu on purpose: glibc is
          # backwards compatible, so a 22.04 build runs on 24.04 and later,
          # while the reverse is not true. This one job emits .deb, .rpm and
          # .AppImage, which covers Debian/Ubuntu, Fedora/RHEL, and everything
          # else respectively.
          - platform: ubuntu-22.04
            label: Linux (.deb + .rpm + .AppImage)
            args: --config src-tauri/tauri.release.conf.json

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # See ci.yml for why these are needed. patchelf is additionally
      # required here because it is what the AppImage bundler uses to
      # rewrite the interpreter and rpath of the packaged binary.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libkrb5-dev \
            libgtk-3-dev \
            build-essential curl wget file patchelf

      - name: Install pinned Rust toolchain
        run: rustup show

      # A no-op on today's arm64 runners, but it states the target rather
      # than inheriting whatever architecture macos-latest happens to be.
      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      # Restore only, never save. GitHub scopes a cache to the ref that wrote
      # it, and a run may read only its own ref or the default branch — so a
      # cache saved while building tag v0.1.1 is invisible to tag v0.1.2 and
      # to every tag after it, whether or not it has expired. Releases are
      # therefore always cold whatever this says, and saving merely wrote
      # ~0.9 GB per platform that nothing could ever read, evicting by LRU the
      # main-branch CI caches that every push does reuse. Restoring still
      # costs nothing and would pay off if a matching default-branch cache
      # ever existed.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-release
          save-if: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # tauri.conf.json's beforeBuildCommand is `bun run build`, so bun has to
      # be on PATH even though dependencies are installed from the npm
      # lockfile. bun only acts as the script runner here; it resolves tsc and
      # vite out of the node_modules npm just populated.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy ships as an AppImage and needs FUSE to mount itself,
          # which GitHub runners do not provide. This tells it to unpack and
          # run instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The updater accepts nothing this key did not sign. That signature
          # is the only thing between an update endpoint and arbitrary code
          # running on someone's machine, so it is not optional in the way an
          # OS code signature is: without these secrets the build still
          # succeeds and still produces installers, but the update artifacts
          # go out unsigned and every installed client rejects them. Lose the
          # key and no future release can ever be accepted by an existing
          # install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc sign the macOS bundle. Without this the bundler ships
          # whatever the linker produced, which on arm64 is a signature over
          # the executable alone with no seal covering the bundle's resources.
          # `codesign --verify` rejects that outright ("code has no resources
          # but signature indicates they must be present"), and a quarantined
          # copy is reported to the user as "FrameWork is damaged and can't be
          # opened" with no Open Anyway offered — macOS treats it as corrupt
          # rather than merely unidentified, so there is nothing to override.
          # Signing the bundle makes verification pass; Gatekeeper still
          # declines it for having no Developer ID, which is the recoverable
          # path the release notes describe. This is the same signature
          # `npm run sign:e2e` applies locally for the same reason. Replace
          # with a real identity plus notarization credentials to remove the
          # warning entirely.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: FrameWork ${{ inputs.tag || github.ref_name }}
          # Published as a draft so a half-uploaded release is never visible:
          # review the assets on the Releases page, then click Publish.
          releaseDraft: true
          prerelease: false
          # latest.json is the manifest installed copies read to learn a
          # newer release exists. tauri.conf.json points the updater at
          # releases/latest/download/latest.json, which GitHub resolves to
          # whichever release is currently latest — so a draft release is
          # invisible to installed copies until it is published.
          includeUpdaterJson: true
          releaseBody: |
            ## Download

            Pick the file for your computer. No account, terminal, or toolchain needed.

            | Your system | Download |
            | --- | --- |
            | **macOS** (Apple Silicon: M1 or later) | the one ending in `.dmg` |
            | **Windows** | the one ending in `-setup.exe` |
            | **Ubuntu / Debian / Mint** | the one ending in `.deb` |
            | **Fedora / RHEL / openSUSE** | the one ending in `.rpm` |
            | **Any other Linux** | the one ending in `.AppImage` |

            ## First launch

            These builds are not code-signed yet, so your system will warn you
            the first time. Nothing is wrong — an unsigned app is simply one
            that has not paid for a certificate. You only do this once.

            **macOS.** Open the `.dmg` and drag FrameWork to Applications. The
            first launch is refused. Open **System Settings → Privacy &
            Security**, scroll to the bottom, and click **Open Anyway** next to
            the FrameWork message, then confirm. It opens normally after that.

            **Windows.** Run the installer. If a blue *"Windows protected your
            PC"* box appears, click **More info**, then **Run anyway**.

            **Linux.** Double-click the `.deb` or `.rpm` to install it through
            your software centre. For the `.AppImage`, right-click it →
            Properties → Permissions → tick *Allow executing file as program*,
            then double-click.

            ## Opening documents

            FrameWork documents are `.fw` files. The `.dmg`, `-setup.exe`,
            `.deb` and `.rpm` installers register the file type, so
            double-clicking a document opens it. The `.AppImage` does not — an
            AppImage installs nothing system-wide, so open documents from
            inside the app.

            Launching FrameWork on its own starts a throwaway canvas and raises
            the Data library — Save As is what turns it into a real document.
